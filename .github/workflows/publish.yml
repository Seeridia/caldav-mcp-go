name: Publish image to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: tcr-caldav-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY: hkccr.ccs.tencentyun.com
      IMAGE: hkccr.ccs.tencentyun.com/seeridia-static/caldav-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:go-${{ github.sha }}
      - name: Record the image for Dokploy
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Image to deploy in Dokploy: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Record published digest for server-shanghai
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg digest "$DIGEST" '{
            ref: $sha, environment: "caldav-production-image", auto_merge: false,
            required_contexts: [], description: "Published TCR image for server-shanghai",
            payload: {digest: $digest}
          }' | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --silent
