name: Publish image to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcr-caldav-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY: hkccr.ccs.tencentyun.com
      IMAGE: hkccr.ccs.tencentyun.com/seeridia-static/caldav-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:go-${{ github.sha }}
      - name: Record the image for Dokploy
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Image to deploy in Dokploy: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python for deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deployment dependency
        if: github.ref == 'refs/heads/main'
        run: python -m pip install PyYAML==6.0.3
      - name: Deploy the published digest to Dokploy
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_ACCESS_CLIENT_ID: ${{ secrets.DOKPLOY_ACCESS_CLIENT_ID }}
          DOKPLOY_ACCESS_CLIENT_SECRET: ${{ secrets.DOKPLOY_ACCESS_CLIENT_SECRET }}
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "A newer revision owns main. Skipping deployment of this digest."
            exit 0
          fi
          python .github/scripts/deploy-dokploy.py
