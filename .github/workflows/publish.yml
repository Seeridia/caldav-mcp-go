name: Publish image to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcr-caldav-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRY: hkccr.ccs.tencentyun.com
      IMAGE: hkccr.ccs.tencentyun.com/seeridia-static/caldav-mcp
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: publish
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:go-${{ github.sha }}
      - name: Record the image for Dokploy
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Image to deploy in Dokploy: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
